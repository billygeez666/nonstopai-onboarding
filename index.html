  <body>
    <!--
      Static form so Netlify's build-time form detection registers it.
      Used only for "Other Business" signup leads (no pathway/checkout exists
      for custom business types yet) — the React app submits to this form
      name via fetch, this markup is never rendered/shown to visitors.
      Does not affect the Taxi/Takeaway checkout flow in any way.
    -->
    <form name="other-business-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="business_name" />
      <input type="text" name="contact_name" />
      <input type="email" name="contact_email" />
      <input type="tel" name="contact_phone" />
      <input type="text" name="city" />
      <input type="text" name="business_type_other" />
      <textarea name="business_description"></textarea>
      <input type="text" name="opening_hours" />
      <input type="tel" name="transfer_number" />
      <input type="text" name="event_id" />
      <input type="text" name="attribution" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
