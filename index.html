<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NONSTOP AI — AI Operating Systems for Service Businesses</title>
    <meta name="description" content="Every missed call is lost revenue. NONSTOP AI builds complete AI operating systems - website, 24/7 AI receptionist, booking and order capture - for taxi firms, takeaways and more. Setup done for you." />
    <meta name="theme-color" content="#12151C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      Static form so Netlify's build-time form detection registers it.
      Used only for "Other Business" signup leads (no pathway/checkout exists
      for custom business types yet) — the React app submits to this form
      name via fetch, this markup is never rendered/shown to visitors.
      Does not affect the Taxi/Takeaway checkout flow in any way.
    -->
    <form name="other-business-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="business_name" />
      <input type="text" name="contact_name" />
      <input type="email" name="contact_email" />
      <input type="tel" name="contact_phone" />
      <input type="text" name="city" />
      <input type="text" name="business_type_other" />
      <textarea name="business_description"></textarea>
      <input type="text" name="opening_hours" />
      <input type="tel" name="transfer_number" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
