<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Form registration</title></head>
<body style="font-family:sans-serif;background:#05070C;color:#F2F4F9;padding:24px">
<p>This page only registers the <code>service-enquiry</code> form with Netlify Forms. The visible form is rendered by <code>/assets/enquiry.js</code> on the service pages.</p>
<!-- Static copy so Netlify detects the form at deploy time. Field names MUST match enquiry.js. -->
<form name="service-enquiry" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="service-enquiry">
  <input name="bot-field">
  <input name="name"><input name="business_name"><input type="email" name="email"><input type="tel" name="phone">
  <select name="service"><option>Product Video Ads</option></select>
  <select name="package"><option>-</option></select>
  <textarea name="message"></textarea>
  <input type="hidden" name="source_page"><input type="hidden" name="utm_source"><input type="hidden" name="utm_medium">
  <input type="hidden" name="utm_campaign"><input type="hidden" name="utm_content"><input type="hidden" name="utm_term">
  <input type="hidden" name="fbclid"><input type="hidden" name="referrer">
</form>
</body></html>
