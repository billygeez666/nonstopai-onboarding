[build]
  command = "npm ci --include=optional && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Stripe price IDs are public identifiers, not secrets. The verified live price is
# intentionally referenced in source, tests, and migrations for fail-closed checks.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "STRIPE_PRICE_ID,WM_PRODUCTION_STRIPE_PRICE_ID"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
